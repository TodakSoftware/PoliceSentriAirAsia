<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        html, body {
            background: url('TAG-with-bg.png') no-repeat center fixed;
            background-size: cover;
            width: 100%;
            height: 100%;
            overflow: visible;
            padding: 0;
            margin: 0;
        }

        div#gameLogo {
            width: 100%;
            position: absolute;
        }

        .bg {
            background-image: url("TAG-with-bg.png");
            height: 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }

        div#gameLogo img {
            width: 35%;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        div#gameContainer {
            background: transparent !important;
            position: absolute;
            width: 100%;
            height: 100%;
        }

        div#gameContainer canvas {
            position: absolute;
            width: auto;
            height: auto;
        }

        #label-progress {
            color: white;
            position: fixed;
            left: 50%;
            bottom: 20px;
            transform: translate(-50%, -50%);
            margin: 0 auto;
            z-index: 1;
        }

        div#gameContainer canvas[data-pixel-art="true"] {
            position: absolute;
            image-rendering: optimizeSpeed;
            image-rendering: -webkit-crisp-edges;
            image-rendering: -moz-crisp-edges;
            image-rendering: -o-crisp-edges;
            image-rendering: crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: optimize-contrast;
            image-rendering: pixelated;
            -ms-interpolation-mode: nearest-neighbor;
        }

        div#AdOverlay {
            z-index: 9999;
            position: relative;
            margin: 0 auto;
            width: fit-content;
        }

        div#Game-Police-Sentri {
            z-index: 10000;
            position: absolute;
            margin-left: -160px;
        }
    </style>
    <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js"></script>
    <script>
        window.googletag = window.googletag || {cmd: []};
        googletag.cmd.push(function() {
            googletag.defineSlot('/10025506/aa_app/games/Game-Police-Sentri', [[320, 50]], 'Game-Police-Sentri').addService(googletag.pubads());
            googletag.pubads().enableSingleRequest();
            googletag.enableServices();
        });
    </script>

    <script type="text/javascript">
        function hideDiv() {
            document.getElementById('Game-Police-Sentri').style.display = 'none';
        }

        function showDiv() {
            document.getElementById('Game-Police-Sentri').style.display = 'block';
        }

        function androidPlatform() {
            return /Android/i.test(navigator.userAgent);
        }

        function iOSPlatform() {
            return /iPhone|iPad|iPod/i.test(navigator.userAgent);
        }
		
		// Function to receive payload from Unity
        function sendPayloadToWebview(payloadJson) {
            try {
                // Parse the JSON payload
                var payload = JSON.parse(payloadJson);
                
                // Access payload data and do whatever processing needed
                var memberId = payload.memberId;
                var partnerCode = payload.partnerCode;
                var transactionDate = payload.transactionDate;
                var points = payload.points;
                var description = payload.description;
                var referenceNumber = payload.referenceNumber;
                var partnerMID = payload.partnerMID;

                // Example: Log payload data
                console.log("Received Payload:");
                console.log("Member ID:", memberId);
                console.log("Partner Code:", partnerCode);
                console.log("Transaction Date:", transactionDate);
                console.log("Points:", points);
                console.log("Description:", description);
                console.log("Reference Number:", referenceNumber);
                console.log("Partner MID:", partnerMID);

                // Convert payload back to JSON string for sending to the platform-specific function
                var payloadString = JSON.stringify(payload);
                
                if (androidPlatform()) {
                    // Send the payload to the Android app
                    WebViewJavascriptInterface.sendPayloadToWebview(payloadString);
                } else if (iOSPlatform()) {
                    // Send the payload to the iOS app
                    window.webkit.messageHandlers.policeSentri.postMessage(payloadString);
                } else {
                    console.log("Unsupported platform");
                }
            } catch (e) {
                console.error("Error parsing JSON payload:", e);
            }
        }
		
		function goToUpdatePage(){
			if (androidPlatform()) {
				window.location.href = 'https://play.google.com/store/apps/details?id=com.airasia.mobile';
			}else if (iOSPlatform()) {
				window.location.href = 'https://apps.apple.com/my/app/airasia-move-flights-hotels/id565050268';
			} else {
				console.log("Cannot Update! Unsupported platform");
			}
		}
    </script>
</head>
<body>
    <div id="gameContainer">
        <div id="label-progress"></div>
        <div id="AdOverlay">
            <div id='Game-Police-Sentri' style='min-width: 320px; min-height: 50px;'>
                <script>
                    googletag.cmd.push(function() { googletag.display('Game-Police-Sentri'); });

                    function refocusGame() {
                        var gameContainer = document.getElementById('gameContainer');
                        if (gameContainer) {
                            gameContainer.focus();
                        } else {
                            console.error('Game container not found!');
                        }
                    }
                </script>
            </div>
        </div>
        <canvas id="unity-canvas" data-pixel-art="{{{ OPTIMIZE_FOR_PIXEL_ART }}}"></canvas>
        <script src="Build/{{{ LOADER_FILENAME }}}"></script>
        <script>
            window.onload = function() { window.focus(); }
            var unityGame;

            const params = new Proxy(new URLSearchParams(window.location.search), {
                get: (searchParams, prop) => searchParams.get(prop),
            });

            let nickname = params.nickname;
            let memberId = params.memberId;
            let avatar = params.avatar;

            var canvas = document.querySelector("#unity-canvas");

            var config = {
                dataUrl: "Build/{{{ DATA_FILENAME }}}",
                frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
                codeUrl: "Build/{{{ CODE_FILENAME }}}",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "{{{ COMPANY_NAME }}}",
                productName: "{{{ PRODUCT_NAME }}}",
                productVersion: "{{{ PRODUCT_VERSION }}}",
                name: nickname ? nickname : '',
                memberId: memberId ? memberId : '',
                avatar: avatar ? avatar : ''
            };

            var scaleToFit;
            try {
                scaleToFit = !!JSON.parse("{{{ SCALE_TO_FIT }}}");
            } catch (e) {
                scaleToFit = true;
            }
            function progressHandler(progress) {
                var percent = progress * 100 + '%';
                var totalPercent = parseInt(progress * 100);
                canvas.style.background = 'linear-gradient(to right, #5ACFFF, #FF5A1B ' + percent + ', transparent ' + percent + ', transparent) no-repeat bottom';
                canvas.style.backgroundSize = '125% 1.2rem';
                document.getElementById('label-progress').innerHTML = "<img src='spinner.gif' width='14'/> Loading..." + totalPercent + "%";
                
                if (progress == 1) {
                    document.getElementById("label-progress").hidden = true;
                }
            }

            canvas.addEventListener("mousedown", onMouseDown, false);
            function onMouseDown(event) {
                window.focus();
            }

            function onResize() {
                var container = canvas.parentElement;
                var w;
                var h;

                if (scaleToFit) {
                    w = window.innerWidth;
                    h = window.innerHeight;

                    var r = {{{ HEIGHT }}} / {{{ WIDTH }}};

                    if (w * r > window.innerHeight) {
                        w = Math.min(w, Math.ceil(h / r));
                    }
                    h = Math.floor(w * r);
                } else {
                    w = {{{ WIDTH }}};
                    h = {{{ HEIGHT }}};
                }

                container.style.width = canvas.style.width = "100%";
                container.style.height = canvas.style.height = "100%";
            }
            createUnityInstance(canvas, config, progressHandler).then(function (instance) {
                canvas = instance.Module.canvas;
                unityGame = instance;
                unityGame.SendMessage("ConfigReceiver", "SetConfig", JSON.stringify(config));
                onResize();
            });

            window.addEventListener('resize', onResize);
            onResize();

            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                const meta = document.createElement('meta');
                meta.name = 'viewport';
                meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
                document.getElementsByTagName('head')[0].appendChild(meta);
            }
        </script>

        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
            import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-analytics.js";

            const firebaseConfig = {
                apiKey: "AIzaSyCi50eXKdfR2gl20faFg2tbuZ2knq3FY3Q",
                authDomain: "police-sentri-airasia.firebaseapp.com",
                projectId: "police-sentri-airasia",
                storageBucket: "police-sentri-airasia.appspot.com",
                messagingSenderId: "156009116415",
                appId: "1:156009116415:web:4512ce69486649377b12ca",
                measurementId: "G-9NR2VDKCBY"
            };

            const app = initializeApp(firebaseConfig);
            const analytics = getAnalytics(app);
        </script>
    </div>
</body>
</html>
